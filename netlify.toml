[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# ---------------------------------------------------------------------------
# Intestazioni di sicurezza
#
# Il sito non carica nulla da fuori: i caratteri sono installati in
# public/font/, non c'è analisi del traffico. L'unico servizio esterno è il
# progetto Supabase dell'area riservata, nominato per esteso in `connect-src`
# — mai con un carattere jolly, che vanificherebbe il senso della direttiva.
# Questo permette una politica dei contenuti molto più stretta di quella che
# quasi tutti i siti possono permettersi, e le dà un valore in più: non è solo
# una difesa, è il browser che fa rispettare quello che la pagina cookie
# dichiara. Se un domani qualcuno aggiungesse per distrazione un font di
# Google o uno script di statistiche, non funzionerebbe — invece di funzionare
# in silenzio e rendere falsa l'informativa.
#
# `script-src` ammette 'unsafe-inline' perché Next inserisce nella pagina i
# dati di idratazione come script in linea. Toglierlo richiede i nonce, che
# renderebbero dinamica ogni pagina oggi statica. Rivalutato il 24 settembre
# 2026, con i moduli pubblici già online, e tenuto: nessun testo scritto da
# soci o direttori arriva nella pagina senza l'escape di React, e una prova in
# `intestazioniSicurezza.test.ts` fallisce se compare HTML grezzo. In cambio si
# è aggiunto `script-src-attr 'none'`, che blocca gli attributi evento
# (`onerror="…"`), la strada classica di un'iniezione. Il perché completo sta
# in `docs/decisioni.md`.
#
# **Il giorno in cui si accende Turnstile** questa politica va allargata a
# `https://challenges.cloudflare.com` in `script-src` e in `frame-src`. Senza,
# il browser blocca il widget, il modulo parte senza gettone e il server
# respinge ogni richiesta.
#
# Queste regole valgono per i file che serve la CDN — caratteri, immagini, i
# due SVG del marchio. **Non arrivano all'HTML**: le pagine le serve la
# funzione del runtime Next, che il file di Netlify non lo legge. Misurato in
# produzione il 22 settembre 2026: la politica dei contenuti c'era sul PNG di
# un partner e mancava su `/`, `/privacy` e `/offerte`.
#
# Per le pagine le stesse intestazioni passano da `headers()` in
# `web/next.config.ts`, e i valori stanno in
# `web/src/lib/intestazioniSicurezza.ts`. Le due copie devono restare
# identiche: se cambi una riga qui, cambiala anche là — `intestazioniSicurezza
# .test.ts` legge questo file e fallisce se divergono.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"

  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; script-src-attr 'none'; connect-src 'self' https://mfwtepgynxcypzetblwc.supabase.co; upgrade-insecure-requests"

    # Il sito non va incorniciato in pagine altrui: è la difesa contro il
    # clickjacking, e vale doppio su un sito legato alla pubblica
    # amministrazione, dove una copia incorniciata è un ottimo inganno.
    X-Frame-Options = "DENY"

    # Il browser non deve indovinare il tipo di un file: se diciamo che è
    # un'immagine, va trattata come tale e mai eseguita.
    X-Content-Type-Options = "nosniff"

    # Uscendo verso il sito di un convenzionato non gli diciamo da quale
    # pagina arriva il socio, solo che arriva dal nostro dominio.
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Nessuna di queste capacità serve al sito. Dichiararlo impedisce che una
    # pagina compromessa possa chiederle.
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

    # Un anno di sola HTTPS. Il flag `preload` si aggiunge quando il sito sarà
    # sul dominio definitivo: è una decisione difficile da annullare.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# I caratteri hanno un nome che non cambia mai e un contenuto che non cambia
# mai: si possono tenere in cache per sempre. È la differenza fra un sito che
# al secondo accesso è istantaneo e uno che riscarica 64 KB ogni volta.
[[headers]]
  for = "/font/*"

  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
